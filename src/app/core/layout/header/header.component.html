<nav class="site-header" [class.scrolled]="spy.scrolled()">
    <div class="container header-inner">
        <a class="logo" href="#home">VK</a>

        <ul class="nav-links" [class.open]="menuOpen()">
            @for (link of navLinks; track link.id) {
                <li>
                    <a [href]="link.href" [class.active]="spy.activeSection() === link.id" (click)="closeMenu()">
                        {{ link.label }}
                    </a>
                </li>
            }
        </ul>

        <div class="header-actions">
            <button class="theme-toggle" (click)="theme.toggle()" aria-label="Toggle theme">
                <fa-icon [icon]="theme.isDark() ? faSun : faMoon"></fa-icon>
            </button>
            <button class="menu-toggle" (click)="toggleMenu()" [attr.aria-expanded]="menuOpen()" aria-label="Toggle navigation menu">
                <fa-icon [icon]="menuOpen() ? faXmark : faBars"></fa-icon>
            </button>
        </div>
    </div>
</nav>
