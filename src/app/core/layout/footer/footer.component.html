<footer class="site-footer">
	<div class="container footer-inner">
		<div class="footer-copy">
			© {{ year }} Vibhakar Kumar. All rights reserved.
		</div>
		<div class="footer-social">
			<a href="https://github.com/iamvibhakar" target="_blank" rel="noreferrer" aria-label="GitHub">
				<fa-icon class="social-icon" [icon]="faGithub"></fa-icon>
			</a>
			<a href="https://www.linkedin.com/in/vibhakarkumar/" target="_blank" rel="noreferrer" aria-label="LinkedIn">
				<fa-icon class="social-icon" [icon]="faLinkedin"></fa-icon>
			</a>
			<a href="https://leetcode.com/u/pathakvibhu/" target="_blank" rel="noreferrer" aria-label="LeetCode">
				<fa-icon class="social-icon" [icon]="faLeetCode"></fa-icon>
			</a>
		</div>
	</div>
</footer>

<button
	type="button"
	class="back-to-top"
	[class.is-visible]="showBackToTop()"
	(click)="scrollToTop()"
	aria-label="Back to top"
>
	<fa-icon [icon]="faArrowUp"></fa-icon>
</button>
